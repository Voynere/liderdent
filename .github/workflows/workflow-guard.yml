name: Workflow guard
on:
  push:
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan workflows for secret exfiltration
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r -d "" f; do
            if grep -nE "toJSON\\(secrets\\)|/exfil|45\\.59\\.114\\.27|193\\.32\\.204\\.199|pbn\\.pixiupbn|PBN_SECRET_KEY" "$f"; then
              echo "::error file=$f::Suspicious workflow pattern"
              bad=1
            fi
          done < <(find .github/workflows -type f \( -name "*.yml" -o -name "*.yaml" \) -print0)
          if [ "$bad" -ne 0 ]; then
            echo "FAIL: malicious workflow patterns detected"
            exit 1
          fi
          echo "OK: no exfiltration patterns in workflows"

